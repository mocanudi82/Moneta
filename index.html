<style>
/* Layout: one phone-width column, three views behind a fixed bottom bar; cards with a starred, underlined header. */
:root{
  color-scheme:dark;
  --bg:#152226; --card:#22363a; --card2:#2d4549; --line:#40595d;
  --fg:#efe9da; --mut:#9db3b0; --teal:#6fb7b6; --star:#e2553b;
  --blue:#6aa5ea; --blueL:#33506f; --orange:#eb9a4e; --orangeL:#6a4a2d;
  --green:#62c08d; --greenL:#2f5a46; --violet:#a992e6; --violetL:#463f6b;
  --red:#f0604f; --ink:#152226;
  --f:"Oswald","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;font-weight:400;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 104px;display:flex;flex-direction:column;gap:14px}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{border-radius:10px;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 2px}
.top h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.top span{color:var(--mut);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hd h2{margin:0;font-size:19px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-bottom:4px solid var(--teal);padding-bottom:3px}
.hd h2::before{content:"★";color:var(--star);margin-right:8px}
.hd .sum{font-size:19px;font-weight:500;white-space:nowrap}
.big{font-size:44px;font-weight:600;line-height:1.05;letter-spacing:.01em}
.lbl{color:var(--mut);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--card2);border-radius:14px;padding:10px 9px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:17px;font-weight:500;white-space:nowrap}
.stats.four .stat b{font-size:20px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats.two .stat{padding:14px 11px 11px;gap:3px}
.stats.two .stat b{font-size:22px;font-weight:600}
.s2{font-size:13px;color:var(--mut)}
.neg{color:var(--red)} .over{color:var(--orange)} .pos{color:var(--green)}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--bg)}
.split i{display:block;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;width:100%;background:var(--card2);border-radius:14px;padding:10px 12px;min-width:0}
.row .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .n{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.row .v{font-size:18px;font-weight:500;white-space:nowrap;text-align:right}
.row .v small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.bar{height:8px;border-radius:4px;position:relative;overflow:hidden;margin-top:6px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;text-align:center;padding:8px 6px;border-radius:10px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--ink);font-weight:600}
.step{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step b{font-size:19px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;text-align:center;flex:1}
.ib{width:42px;height:42px;border-radius:21px;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:none}
.btn{background:var(--teal);color:var(--ink);font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:14px;padding:12px 14px;text-align:center;font-size:15px}
.btn.ghost{background:var(--card2);color:var(--fg);font-weight:500}
.btn.danger{background:none;border:1px solid var(--red);color:var(--red)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 120px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--bg);color:var(--mut);letter-spacing:.03em}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;font-size:17px}
textarea{resize:vertical;min-height:64px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav div{max-width:560px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;text-align:center;padding:10px 4px;border-radius:14px;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.nav button[aria-current="page"]{background:var(--card2);color:var(--fg);font-weight:600;box-shadow:inset 0 -3px 0 var(--teal)}
.ov{position:fixed;inset:0;background:rgba(8,14,16,.72);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.note{color:var(--mut);font-size:14px}
.msg{background:var(--card2);border-radius:14px;padding:12px;font-size:15px}
svg{display:block;width:100%;height:auto}
@media (max-width:380px){.big{font-size:38px}.stats.two .stat b{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.bar i,.split i{transition:width .25s ease}}

<script>
(function(){var P="moneta:";function keys(){var o=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(P)===0)o.push(k)}}catch(e){}return o}
function snap(id,raw){var v=raw==null?undefined:JSON.parse(raw);return {id:id,exists:v!==undefined,data:function(){return v}}}
var db={doc:function(p){return {get:function(){return Promise.resolve(snap(p.split("/").pop(),localStorage.getItem(P+p)))},set:function(v){try{localStorage.setItem(P+p,JSON.stringify(v));return Promise.resolve()}catch(e){return Promise.reject({code:"storage_full"})}}}},
 collection:function(c){var q={limit:function(){return q},get:function(){return Promise.resolve({docs:keys().filter(function(k){return k.indexOf(P+c+"/")===0}).map(function(k){return snap(k.split("/").pop(),localStorage.getItem(k))})})}};return q}};
window.MONETA_LOCAL={clear:function(){keys().forEach(function(k){localStorage.removeItem(k)})}};
window.claude={use:function(n){return Promise.resolve(n==="db"?db:null)}};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
})();

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var GROUPS=["Bank","Savings","Employee savings","Pension"];
var GCOL={"Bank":"var(--teal)","Savings":"var(--green)","Employee savings":"var(--blue)","Pension":"var(--orange)"};
var TCOL={Income:["var(--teal)","var(--line)"],Essential:["var(--blue)","var(--blueL)"],Fun:["var(--orange)","var(--orangeL)"],Family:["var(--violet)","var(--violetL)"],Savings:["var(--green)","var(--greenL)"],Neutral:["var(--mut)","var(--card)"]};
var TNAME={Income:"Income",Essential:"Essentials",Fun:"Discretionary",Family:"Family",Savings:"Savings",Neutral:"Not counted"};
var SC={P:"Personal",J:"Joint"};
var S={assets:null,cfg:null,plan:{},tx:{}};
var UI={tab:"budget",scope:"P",year:0,month:0,mode:"month",q:""};
var db=null,dl=null,ready=false;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function eur(v,d){if(v==null||isNaN(v))return "—";return new Intl.NumberFormat("en-GB",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}).format(v)+" €"}
function money(v,cur,d){if(v==null)return "—";var s=new Intl.NumberFormat("en-GB",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}).format(v);return cur==="GBP"?"£"+s:s+" €"}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(iso){if(!iso)return "";var p=iso.split("-");return (+p[2])+" "+MON[+p[1]-1]+" "+p[0]}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return "a"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}

/* ---------- data access ---------- */
function rowsOf(sc){var out=[];Object.keys(S.tx).forEach(function(k){if(k[0]===sc)S.tx[k].rows.forEach(function(r,i){out.push({k:k,i:i,r:r})})});return out}
function catsOf(sc){return (S.cfg&&S.cfg.cats[SC[sc]])||[]}
function groupOf(sc,cat){var c=catsOf(sc).find(function(x){return x[0]===cat});return c?c[1]:"Neutral"}
function classify(sc,text){var up=String(text).toUpperCase(),res="Unsorted",ix=sc==="P"?1:2;
  (S.cfg.rules||[]).forEach(function(r){if(r[0]&&up.indexOf(String(r[0]).toUpperCase())>=0&&r[ix])res=r[ix]});return res}
function planOf(sc,y,cat){var p=S.plan[y];return (p&&p[SC[sc]]&&p[SC[sc]][cat])||null}

var queue=Promise.resolve();
function write(path,data){ if(!db)return; var body=clone(data);
  queue=queue.then(function(){return db.doc(path).set(body)}).catch(function(e){toast("Could not save ("+((e&&e.code)||"error")+"). Your change is still on screen; try again.")});}
function saveAssets(){snapshotTotal();write("fin/assets",S.assets)}
function saveTx(k){write("tx/"+k,S.tx[k])}
function savePlan(y){write("plan/"+y,S.plan[y])}

/* ---------- assets maths ---------- */
function linkDelta(a){if(!a.link||!a.asOf)return 0;var t=0;
  rowsOf(a.link.scope).forEach(function(x){var r=x.r;if(r.d>a.asOf){if(a.link.kind==="account")t+=r.a;else if(r.c===a.link.cat)t-=r.a}});return t}
function val(a){return a.base==null?null:a.base+linkDelta(a)}
function inEur(a){var v=val(a);return v==null?null:(a.cur==="GBP"?v*S.assets.gbp:v)}
function total(){return S.assets.items.reduce(function(t,a){return t+(a.shared?0:(inEur(a)||0))},0)}
function parts(a){var v=inEur(a);if(v==null)return [];var t=today(),lim=(+t.slice(0,4)+5)+t.slice(4);
  function k(d){return d<=t?"now":d<=lim?"soon":"later"} function lb(d){return d<=t?"Today":"From "+fdate(d)}
  if(a.access==="now")return [{k:"now",label:"Today",v:v}];
  if(a.access==="retirement")return [{k:"later",label:"At retirement",v:v}];
  var out=[],s=0;(a.releases||[]).forEach(function(x){if(x.d&&x.a){s+=x.a;out.push({k:k(x.d),label:lb(x.d),v:x.a})}});
  var rest=v-s;if(rest>0.5||!out.length){if(a.frm)out.push({k:k(a.frm),label:lb(a.frm),v:rest});else if(a.latest)out.push({k:k(a.latest),label:"By "+fdate(a.latest)+" at the latest",v:rest});else out.push({k:"later",label:"Date not set",v:rest})}
  return out}
function snapshotTotal(){var h=S.assets.history||(S.assets.history=[]),d=today(),v=Math.round(total()*100)/100;
  var last=h[h.length-1];if(last&&last.d===d)last.v=v;else h.push({d:d,v:v});if(h.length>400)h.splice(0,h.length-400)}

/* ---------- budget maths ---------- */
function actuals(sc,y,m){var o={};rowsOf(sc).forEach(function(x){var r=x.r;if(+r.d.slice(0,4)!==y)return;if(m&&+r.d.slice(5,7)!==m)return;
    var g=groupOf(sc,r.c);o[r.c]=(o[r.c]||0)+(g==="Income"?r.a:-r.a)});return o}
function planned(sc,y,m,cat){var p=planOf(sc,y,cat);if(!p)return 0;return m?(p[m-1]||0):p.reduce(function(a,b){return a+(b||0)},0)}

/* ---------- rendering ---------- */
function render(){
  ["assets","budget","lines","insights"].forEach(function(t){var b=$("nav-"+t);if(t===UI.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(!ready)return;
  $("view").innerHTML=UI.tab==="assets"?vAssets():UI.tab==="budget"?vBudget():UI.tab==="insights"?vInsights():vLines();
}
function spark(h){if(!h||h.length<2)return "";var W=320,H=70,mn=Math.min.apply(null,h.map(function(p){return p.v})),mx=Math.max.apply(null,h.map(function(p){return p.v}));if(mx===mn){mx+=1;mn-=1}
  var pts=h.map(function(p,i){return [8+i*(W-16)/(h.length-1),8+(H-16)*(1-(p.v-mn)/(mx-mn))]});
  var d=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)}).join(" ");var e=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Value over time"><path d="'+d+' L'+e[0].toFixed(1)+' '+(H-2)+' L8 '+(H-2)+' Z" fill="var(--teal)" opacity=".14"/><path d="'+d+'" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="4.5" fill="var(--teal)"/></svg>'

function pDate(v){if(v==null||v==="")return null;if(typeof v==="number"){if(v<20000||v>80000)return null;var d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10)}
  if(v instanceof Date)return v.toISOString().slice(0,10);var s=String(v).trim(),m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");

  if(s.indexOf(",")>=0)s=s.replace(/\./g,"").replace(",",".");var n=parseFloat(s);return /^-?\d*\.?\d+$/.test(s)&&isFinite(n)?n:null}

  if(wb.SheetNames.indexOf("Personal Entry")>=0){res.kind="workbook";[["P","Personal Entry"],["J","Joint Entry"]].forEach(function(p){if(!wb.Sheets[p[1]])return;
      aoa(p[1]).slice(7).forEach(function(r){var d=pDate(r[0]),a=pAmt(r[2]);if(!d||a==null||!clean(r[1]))return;var c=clean(r[5])||clean(r[3]);res[p[0]].push({d:d,t:clean(r[1]),a:a,c:c||"",n:clean(r[4])})})});return res}
  var rows=aoa(wb.SheetNames[0]),hi=-1,cd=0,ct=3,ca=4,cdeb=-1,ccr=-1,cc=-1,cn=-1;
  for(var i=0;i<Math.min(rows.length,15);i++){var r=(rows[i]||[]).map(function(x){return clean(x).toLowerCase()});var d=r.findIndex(function(x){return /^date/.test(x)}),a=r.findIndex(function(x){return /montant|amount/.test(x)});
    if(d>=0&&(a>=0||r.some(function(x){return /d[ée]bit/.test(x)}))){hi=i;cd=d;ca=a;var t=-1;r.forEach(function(x,j){if(/libell|description|label|intitul/.test(x))t=j});ct=t>=0?t:d+1;
      cdeb=r.findIndex(function(x){return /d[ée]bit/.test(x)});ccr=r.findIndex(function(x){return /cr[ée]dit/.test(x)});cc=r.findIndex(function(x){return /^categor|^cat[ée]gor/.test(x)});cn=r.findIndex(function(x){return /^note/.test(x)});break}}

  rows.slice(hi+1).forEach(function(r){if(!r)return;var d=pDate(r[cd]);if(!d)return;var a=ca>=0?pAmt(r[ca]):null;
    if(a==null&&(cdeb>=0||ccr>=0)){var de=cdeb>=0?pAmt(r[cdeb]):null,cr=ccr>=0?pAmt(r[ccr]):null;if(de!=null&&de!==0)a=-Math.abs(de);else if(cr!=null)a=Math.abs(cr)}
    if(a==null)return;var t=clean(r[ct])||clean(r[1])||clean(r[2])||"(no description)";res[UI.scope].push({d:d,t:t,a:a,c:cc>=0?clean(r[cc]):"",n:cn>=0?clean(r[cn]):""})});
  return res}

  timer=setTimeout(function(){if(!ready)fail("Your data can’t be reached yet. Check the connection and open the page again.")},10000);
  window.claude.use("downloads").then(function(x){dl=x}).catch(function(){});
  window.claude.use("db").then(function(x){db=x;if(!db){clearTimeout(timer);fail("Your figures are kept in your Claude account. Sign in as the owner of this page to see them.");return null}return load()})
  .catch(function(e){clearTimeout(timer);fail("Your data could not be loaded ("+((e&&e.code)||"error")+"). Open the page again in a moment.")})}
start();
})();
